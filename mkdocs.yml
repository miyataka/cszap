site_name: CSZAP — CS学習メモ
site_description: Computer Science Curricula 2023 (CS2023) を題材にしたCS学習メモ
site_url: https://miyataka.github.io/cszap/
repo_url: https://github.com/miyataka/cszap
repo_name: miyataka/cszap
docs_dir: docs

validation:
  links:
    anchors: warn

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

hooks:
  - hooks/mermaid_lazy.py

extra_css:
  - assets/css/floyd-warshall.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/mermaid-lazy.js
  - assets/js/floyd-warshall.js

nav:
  - ホーム: index.md
  - 弱点ノート・復習キュー: weak-points.md
  - 用語索引: glossary.md
  - 目次 (CS2023): CS2023-目次.md
  - Algorithmic Foundations (AL):
      - AL-Foundational:
          - 本文: AL/AL-Foundational.md
          - Q&A: AL/AL-Foundational-QA.md
          - 採点記録: AL/AL-Foundational-Quiz.md
          - ワーシャルフロイド法 アニメ: AL/floyd-warshall.md
          - Hash Table 実装サンプル: AL/hashtable-code.md
      - AL-Strategies:
          - 本文: AL/AL-Strategies.md
          - Q&A: AL/AL-Strategies-QA.md
          - 採点記録: AL/AL-Strategies-Quiz.md
      - AL-Complexity:
          - 本文: AL/AL-Complexity.md
          - Q&A: AL/AL-Complexity-QA.md
          - 採点記録: AL/AL-Complexity-Quiz.md
      - AL-Models:
          - 本文: AL/AL-Models.md
          - Q&A: AL/AL-Models-QA.md
  - Operating Systems (OS):
      - OS-Purpose: OS/OS-Purpose.md
      - OS-Principles: OS/OS-Principles.md
      - OS-Concurrency: OS/OS-Concurrency.md
      - OS-Protection:
          - 本文: OS/OS-Protection.md
          - 採点記録: OS/OS-Protection-Quiz.md
      - OS-Scheduling: OS/OS-Scheduling.md
      - OS-Process:
          - 本文: OS/OS-Process.md
          - 採点記録: OS/OS-Process-Quiz.md
      - OS-Memory:
          - 本文: OS/OS-Memory.md
          - 採点記録: OS/OS-Memory-Quiz.md
      - OS-Devices:
          - 本文: OS/OS-Devices.md
          - 採点記録: OS/OS-Devices-Quiz.md
      - OS-Files:
          - 本文: OS/OS-Files.md
          - 採点記録: OS/OS-Files-Quiz.md
      - OS-Advanced-Files:
          - 本文: OS/OS-Advanced-Files.md
          - 採点記録: OS/OS-Advanced-Files-Quiz.md
      - OS-Virtualization:
          - 本文: OS/OS-Virtualization.md
          - 採点記録: OS/OS-Virtualization-Quiz.md
      - OS-Real-time: OS/OS-Real-time.md
      - OS-Faults:
          - 本文: OS/OS-Faults.md
          - 採点記録: OS/OS-Faults-Quiz.md
  - Networking and Communication (NC):
      - NC-Fundamentals: NC/NC-Fundamentals.md
      - NC-SingleHop: NC/NC-SingleHop.md
