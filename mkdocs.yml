site_name: CSZAP — CS学習メモ
site_description: Computer Science Curricula 2023 (CS2023) を題材にしたCS学習メモ
site_url: https://miyataka.github.io/cszap/
repo_url: https://github.com/miyataka/cszap
repo_name: miyataka/cszap
docs_dir: docs

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

hooks:
  - hooks/mermaid_lazy.py

extra_css:
  - assets/css/floyd-warshall.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/mermaid-lazy.js
  - assets/js/floyd-warshall.js

nav:
  - ホーム: index.md
  - 目次 (CS2023): CS2023-目次.md
  - Algorithmic Foundations (AL):
      - AL-Foundational: AL/AL-Foundational.md
      - AL-Foundational Q&A: AL/AL-Foundational-QA.md
      - AL-Foundational 採点記録: AL/AL-Foundational-Quiz.md
      - ワーシャルフロイド法 アニメ: AL/floyd-warshall.md
      - Hash Table 実装サンプル: AL/hashtable-code.md
      - AL-Strategies: AL/AL-Strategies.md
      - AL-Strategies Q&A: AL/AL-Strategies-QA.md
      - AL-Strategies 採点記録: AL/AL-Strategies-Quiz.md
      - AL-Complexity: AL/AL-Complexity.md
      - AL-Complexity Q&A: AL/AL-Complexity-QA.md
      - AL-Complexity 採点記録: AL/AL-Complexity-Quiz.md
      - AL-Models: AL/AL-Models.md
      - AL-Models Q&A: AL/AL-Models-QA.md
  - Operating Systems (OS):
      - OS-Purpose: OS/OS-Purpose.md
      - OS-Purpose Q&A: OS/OS-Purpose-QA.md
      - OS-Principles: OS/OS-Principles.md
      - OS-Principles Q&A: OS/OS-Principles-QA.md
      - OS-Concurrency: OS/OS-Concurrency.md
      - OS-Concurrency Q&A: OS/OS-Concurrency-QA.md
      - OS-Protection: OS/OS-Protection.md
      - OS-Protection Q&A: OS/OS-Protection-QA.md
      - OS-Protection 採点記録: OS/OS-Protection-Quiz.md
      - OS-Scheduling: OS/OS-Scheduling.md
      - OS-Scheduling Q&A: OS/OS-Scheduling-QA.md
      - OS-Process: OS/OS-Process.md
      - OS-Process Q&A: OS/OS-Process-QA.md
      - OS-Process 採点記録: OS/OS-Process-Quiz.md
      - OS-Memory: OS/OS-Memory.md
      - OS-Memory Q&A: OS/OS-Memory-QA.md
      - OS-Memory 採点記録: OS/OS-Memory-Quiz.md
      - OS-Devices: OS/OS-Devices.md
      - OS-Devices Q&A: OS/OS-Devices-QA.md
      - OS-Devices 採点記録: OS/OS-Devices-Quiz.md
      - OS-Files: OS/OS-Files.md
      - OS-Files Q&A: OS/OS-Files-QA.md
      - OS-Files 採点記録: OS/OS-Files-Quiz.md
      - OS-Advanced-Files: OS/OS-Advanced-Files.md
