site_name: CSZAP — CS学習メモ
site_description: Computer Science Curricula 2023 (CS2023) を題材にしたCS学習メモ
site_url: https://miyataka.github.io/cszap/
repo_url: https://github.com/miyataka/cszap
repo_name: miyataka/cszap
docs_dir: docs

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

hooks:
  - hooks/mermaid_lazy.py

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/mermaid-lazy.js

nav:
  - ホーム: index.md
  - 目次 (CS2023): CS2023-目次.md
  - Algorithmic Foundations (AL):
      - AL-Foundational: AL/AL-Foundational.md
      - AL-Foundational Q&A: AL/AL-Foundational-QA.md
      - AL-Foundational 採点記録: AL/AL-Foundational-Quiz.md
      - Hash Table 実装サンプル: AL/hashtable-code.md
