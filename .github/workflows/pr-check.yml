name: PR build check

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/pr-check.yml"

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --strict でリンク切れ・ビルド警告をエラー扱いにして PR で検出する
      - run: mkdocs build --strict
      # 成果物を artifact として上げ、レビュアーがローカルで開けるようにする
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: site
          retention-days: 7
